so101_pick_place:
  ros__parameters:
    # 搬送先・開閉角・指先オフセットを決めてからtrueへ。
    configuration_ready: true
    keyboard_enabled: true
    base_frame: base_link
    tip_link: gripper_link
    # gripper_link原点から指の把持中心まで。リンクのローカル座標、m。
    # tip_link → tcp_link の固定TFとしても出力（変更後はlaunchを再起動）。
    tcp_offset_m: [0.01, 0.0, -0.1]
    # 仮値。実機では指先位置を測ってからtrueにする。
    tcp_offset_confirmed: true
    # 物体原点から把持点まで。物体ローカル座標、m。
    grasp_offset_object_m: [0.0, 0.0, 0.0]
    # 仮の搬送先。base_link基準、TCPが物体を解放する位置（m）。
    place_xyz_m: [0.0, -0.2, 0.2]
    # URDFのgripper関節角、rad。仮値。現モデルの範囲 -0.222427～0.868233。
    gripper_open_rad: 0.8
    gripper_closed_rad: 0.0
    approach_height_m: 0.04
    lift_height_m: 0.06
    place_approach_height_m: 0.06
    retreat_height_m: 0.06
    # 指先の到達許容誤差。5軸・位置のみ。任意の把持姿勢は拘束しない。
    position_tolerance_m: 0.004
    reached_tolerance_m: 0.015
    # grasp以外のアーム移動の到達許容値。計画・衝突判定の精度は維持。
    transit_reached_tolerance_m: 0.030
    transit_joint_tolerance_rad: 0.10
    # 把持への移動の関節到達許容値。従来のコントローラー設定と同じ。
    grasp_joint_tolerance_rad: 0.065
    velocity_scaling: 0.7
    acceleration_scaling: 0.7
    planning_time_s: 5.0
    action_timeout_s: 120.0
    # Enter時に直近の両マーカー由来Poseが新しく安定していることを確認。
    target_timeout_s: 0.35
    stable_window_s: 0.5
    stable_min_samples: 5
    stable_position_std_m: 0.004
    stable_position_range_m: 0.015
    joint_state_timeout_s: 1.0
    max_target_shift_before_grasp_m: 0.015
    start_joint_tolerance_rad: 0.06
    gripper_reached_tolerance_rad: 0.05
    # base_link基準の作業範囲。接近・持上げ・搬送先も全てこの中に収める。
    workspace_min_m: [-0.3,-0.30, 0.0]
    workspace_max_m: [0.3, 0.30, 0.40]
    # 把持後の衝突判定用。TCP中心の球で近似する。一辺20mmを包含。
    payload_radius_m: 0.018
    # 机は実測後に有効化。top_zがbase_linkから見た天板高さ。
    table_enabled: false
    table_top_z_m: 0.0
    table_size_m: [1.0, 1.0, 0.04]
    table_center_xy_m: [0.0, 0.0]
